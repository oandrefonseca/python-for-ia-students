name: Build and deploy Quarto site to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Ensure the action can push to the gh-pages branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gdebi-core

      - name: Install Quarto CLI
        run: |
          # Try to download the latest Linux .deb from the official releases
          wget -qO quarto.deb https://github.com/quarto-dev/quarto-cli/releases/latest/download/quarto-linux-amd64.deb || true
          if [ -s quarto.deb ]; then
            sudo apt-get install -y ./quarto.deb || (sudo dpkg -i quarto.deb && sudo apt-get install -f -y)
          else
            echo "Failed to download quarto .deb. Exiting." >&2
            exit 1
          fi

      - name: Render Quarto site
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _book
          publish_branch: gh-pages
